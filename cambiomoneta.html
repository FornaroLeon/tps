
<html>
<head>
    <title>Convertitore Euro</title>
</head>

<body>

<h1>Convertitore di valute in Euro</h1>

<p>Scegli la valuta:</p>

<select id="valuta"></select>

<p>Inserisci la quantità:</p>

<input type="number" id="quantita">

<button onclick="calcola()">Converti</button>

<p id="risultato"></p>

<script>

let cambi = {};

function caricaValute() {

    fetch("https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml")
    .then(response => response.text())
    .then(testo => {

        let documento = new DOMParser().parseFromString(testo, "text/xml");

        let valute = documento.getElementsByTagName("Cube");

        let elenco = document.getElementById("valuta");

        let opzione = document.createElement("option");
        opzione.value = "1";
        opzione.text = "EUR - Euro";
        elenco.appendChild(opzione);

        cambi["EUR"] = 1;

        for (let i = 0; i < valute.length; i++) {

            let codice = valute[i].getAttribute("currency");
            let cambio = valute[i].getAttribute("rate");

            if (codice != null) {

                cambi[codice] = cambio;

                let opzione = document.createElement("option");

                opzione.value = codice;
                opzione.text = codice;

                elenco.appendChild(opzione);
            }
        }

    });

}

function calcola() {

    let valuta = document.getElementById("valuta").value;

    let quantita = document.getElementById("quantita").value;

    let euro = quantita / cambi[valuta];

    document.getElementById("risultato").innerHTML =
        "Il controvalore è: " + euro.toFixed(2) + " Euro";

}

caricaValute();

</script>

</body>
</html>
